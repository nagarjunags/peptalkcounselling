name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        # No VITE_BASE_PATH — the site is served from the root of the custom
        # domain (kcetcouncelling.physicspeptalks.in), so base must be "/".
        # Setting VITE_BASE_PATH=/peptalkcounselling/ would break asset paths.
        run: npm run build

      - name: Verify build output
        run: |
          echo "===== dist/index.html (first 5 lines) ====="
          head -5 dist/index.html
          echo ""
          echo "===== Asset references in dist/index.html ====="
          grep -oE 'src="[^"]*\.js[^"]*"' dist/index.html || echo "No JS src found"
          grep -oE 'href="[^"]*\.css[^"]*"' dist/index.html || echo "No CSS href found"
          echo ""
          echo "===== dist/ contents ====="
          ls -lh dist/
          ls -lh dist/assets/ || echo "No assets dir"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
