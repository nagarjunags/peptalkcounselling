name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Set the base path for GitHub Pages deployment
          # This ensures assets are served from /peptalkcounselling/assets/...
          VITE_BASE_PATH: /peptalkcounselling/

      - name: Verify GitHub Pages base path
        run: |
          echo "===== GENERATED dist/index.html HEAD ====="
          head -20 dist/index.html
          echo ""
          echo "===== GENERATED ASSET REFERENCES ====="
          echo "Script tags:"
          grep -o 'src="[^"]*\.js"' dist/index.html || echo "No JS found"
          echo "CSS links:"  
          grep -o 'href="[^"]*\.css"' dist/index.html || echo "No CSS found"
          echo "Favicon:"
          grep -o 'href="[^"]*favicon[^"]*"' dist/index.html || echo "No favicon found"
          echo ""
          echo "===== VERIFYING GITHUB PAGES BASE PATH ====="
          if grep -q '/peptalkcounselling/assets/' dist/index.html; then
            echo "✅ SUCCESS: GitHub Pages base path is correct"
            echo "Found JS: $(grep -o '/peptalkcounselling/assets/[^"]*\.js' dist/index.html | head -1)"
            echo "Found CSS: $(grep -o '/peptalkcounselling/assets/[^"]*\.css' dist/index.html | head -1)"
          else
            echo "❌ ERROR: GitHub Pages base path is incorrect"
            echo "Expected /peptalkcounselling/assets/ in dist/index.html but found:"
            grep -o 'src="[^"]*"' dist/index.html | head -5
            echo "Full file paths in dist:"
            ls -la dist/ || echo "No dist directory"
            echo "Environment variables during build:"
            echo "VITE_BASE_PATH: ${VITE_BASE_PATH:-'(not set)'}"
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the dist directory
          path: "./dist"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
